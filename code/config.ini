[xlsx_catalog_hinweis]
section_type = xlsx
sheet = katalog
headline = Anforderung\nHinweis
function = guidance
cell_value_type = string
is_in_sheet = true
width = 100
hidden = false
level = 1
comment = Hinweise (Guidance) sind Erläuterungen zu der Anforderung, die dem besseren Verständnis der Vorschrift dienen (sog. Erwägungsgründe). Aus ihnen können keine unmittelbaren Rechtsfolgen abgeleitet werden, sie sind jedoch bei der Auslegung der Anforderung zu beachten und können dadurch deren Wirkung wesentlich beeinflussen. Insbesondere können folgende Inhalte als Hinweis aufgenommen werden: Ziele und Zweck (Telos) der Anforderung, Verweise auf technische oder rechtliche Normen, Definitionen von Begriffen oder Konzepten, sowie konkrete, herstellerneutrale Beispiele.

[xlsx_catalog_anforderung_status]
section_type = xlsx
sheet = katalog
headline = Anforderung\nReifegrad?
function = anforderung_status
cell_value_type = string
is_in_sheet = true
width = 14
hidden = false
level = 0
comment = Der Leitfaden zur Methodik Grundschutz++ vom März 2026: "Der Umsetzungsstatus einer Anforderung kann grundsätzlich nur „umgesetzt“ („ja“) oder „nicht umgesetzt“ („nein“) sein."\n\nIn diesem Sinn nicht Grundschutz++ konform aber für eine differenzierte Darstellung möglicherweise geeignet: Der Reifegrad der Erfüllung der Anforderung wird in einer von fünf möglichen Stufen ausgedrückt.\n\nStufe 0: Die Anforderung ist nicht erfüllt oder der Erfüllungsstaus ist unbekannt.\n\nStufe 1: Die Erfüllung der Anforderung ist initiiert (mindestens Phase Plan)\n\nStufe 2: Stufe 1 und die Erfüllung der Anforderung ist in großen Anteilen bereits gelebte Praxis (vollständige Phase Plan und Phase Do in Umsetzung)\n\nStufe 3: Stufe 2 und mögliche noch fehlende unterstützende und formale Aspekte sind auch erfüllt (wie z. B. zu Schulung und Dokumentation; vollständige Phasen Plan und Do)\n\nStufe 4: Stufe 3 und regelmäßige Überprüfung & Korrektur der Erfüllung (Phasen Check und Act wurden mindestens einmal durchlaufen)\n\n\nLeitfaden zur Methodik Grundschutz++: https://www.bsi.bund.de/SharedDocs/Downloads/DE/BSI/Grundschutz/sonstiges/Methodik_Grundschutz_PlusPlus.html

