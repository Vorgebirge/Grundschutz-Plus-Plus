[xlsx_catalog_klasse]
section_type = xlsx
headline = Klasse
sheet = katalog
function = klasse
cell_value_type = string
is_in_sheet = true
width = 20
hidden = false
level = 3
comment = Kein Kommentar

[xlsx_catalog_praktik]
section_type = xlsx
sheet = katalog
headline = Praktik
function = praktik
cell_value_type = string
is_in_sheet = true
width = 20
hidden = false
level = 3
comment = Praktiken (OSCAL Groups) sind die “Überschriften”, in die ein Katalog gegliedert ist. Gleichzeitig sind die Praktiken als Vorschläge für (Teil-)Prozesse des ISMS zu betrachten. Jede Praktik kann als eigenständiger, abgrenzbarer (Teil-)Prozess von größerem Umfang angesehen werden, der in einem ISMS zwingend erforderlich ist zur Erreichung der Schutzziele nach ISO/IEC 27001. Die Praktiken sind jedoch nicht gleichzusetzen mit inhaltlichen Geschäftsprozessen wie Finanzwesen oder Vertrieb.  

[xlsx_catalog_thema]
section_type = xlsx
sheet = katalog
headline = Praktik\nThema
function = thema
cell_value_type = string
is_in_sheet = true
width = 23
hidden = false
level = 3
comment = Themen (OSCAL Group in Group)sind die Untergruppen (“Unterüberschriften”) innerhalb einer Praktik und dienen der thematischen Zusammenfassung von Anforderungen, z.B. zum Management von Schwachstellen.

[xlsx_catalog_typ]
section_type = xlsx
sheet = katalog
headline = Praktik\nTyp
function = praktik_typ
cell_value_type = string
is_in_sheet = true
width = 16
hidden = false
level = 3
comment = Praktiken lassen sich unterteilen in:\n- Methodik-Praktiken\n- Organisatorische Praktiken\n- Technische Praktiken\n\nDie Methodik-Praktiken sind übergreifend. Sie bauen einen Plan-Do-Check-Act-Zyklus (PDCA-Zyklus) des Managementsystems auf, der die fortlaufende Kontrolle und Verbesserung über alle Bereiche hinweg gewährleistet.\n\nDie Anforderungen der ISMS-Praktiken sind übergreifend und keiner einzelne Zielobjektkategorie zugewiesen. Sie bauen auf den PDCA-Zyklus des Managementsystems auf und gelten deshalb einmalig für den gesamten Informationsverbund.

[xlsx_catalog_sicherheitsniveau]
section_type = xlsx
sheet = katalog
headline = Anforderung\nSicherheitsniveau
function = sicherheitsniveau
cell_value_type = string
is_in_sheet = true
width = 18
hidden = false
level = 3
comment = Klassifiziert das Sicherheitsniveau bei dem eine Anforderung relevant ist. Mögliche Werte sind normal-SdT für den normalen Stand der Technik oder erhöht für Anforderungen, für die eine individuelle Risikoanalyse erforderlich ist.

[xlsx_catalog_modalverb]
section_type = xlsx
sheet = katalog
headline = Anforderung\nModalverb
function = modalverb
cell_value_type = string
is_in_sheet = true
width = 14
hidden = false
level = 3
comment = Das Modalverb einer Anforderung gibt an, welchen Pflichtcharakter sie hat, d.h. ob es sich um eine MUSS-, SOLLTE- oder KANN-Anforderung handelt. Für die Anforderungen gelten folgende Definitionen:\n\n- MUSS ? verpflichtend, keine Abweichung erlaubt (entspricht „MUST“1).\n\n- SOLLTE ? in der Regel verpflichtend, Abweichung in begründeten Ausnahmefällen möglich (entspricht „SHOULD“).\n\n- KANN ? optional, je nach Situation sinnvoll, aber nicht notwendig (entspricht „MAY“).

[xlsx_catalog_uuid]
section_type = xlsx
sheet = katalog
headline = Anforderung\nUUID
function = alt_identifier
cell_value_type = string
is_in_sheet = true
width = 14
hidden = true
level = 3
comment = UUID: Über alle Kataloge und Katalogversionen hinweg eindeutige Identifikationsnummer der Anforderung. Diese folgt der Bedeutung der Anforderung, bleibt also auch bei bedeutungserhaltenden Umformulierungen oder Verschiebungen von Anforderungen gleich. Andererseits wird sie ersetzt, wenn sich die Bedeutung der Anforderung wesentlich verändert, selbst wenn ihre Stellung in der Struktur bleibt.

[xlsx_catalog_id]
section_type = xlsx
sheet = katalog
headline = Anforderung\nID
function = anforderung_id
cell_value_type = string
is_in_sheet = true
width = 14
hidden = false
level = 0
comment = ID: Eindeutiger Identifikator der Anforderung innerhalb der Praktik und des Themas im Format {Kürzel der Praktik}.{Nummerierung des Themas}.{Nummerierung der Anforderung}. Die ID ergibt sich also aus der Stellung der Anforderung innerhalb des Dokumentes.

[xlsx_catalog_anforderung_titel_ohne_id]
section_type = xlsx
sheet = katalog
headline = Anforderung\nTitel
function = anforderung_titel_ohne_id
cell_value_type = string
is_in_sheet = true
width = 20
hidden = false
level = 0
comment = Titel: Titel der einzelnen Anforderung. Der Titel beschreibt eine Anforderung kurz und prägnant, so dass sie ohne Blick auf den vollständigen Anforderungsinhalt wiederzuerkennen ist. Titel sind nicht normativ.


[xlsx_catalog_anforderung_id_und_titel]
section_type = xlsx
sheet = katalog
headline = Anforderung\nID und Titel
function = anforderung
cell_value_type = string
is_in_sheet = false
width = 30
hidden = false
level = 0
comment = ID: Eindeutiger Identifikator der Anforderung innerhalb der Praktik und des Themas im Format {Kürzel der Praktik}.{Nummerierung des Themas}.{Nummerierung der Anforderung}. Die ID ergibt sich also aus der Stellung der Anforderung innerhalb des Dokumentes.\n\nTitel: Titel der einzelnen Anforderung. Der Titel beschreibt eine Anforderung kurz und prägnant, so dass sie ohne Blick auf den vollständigen Anforderungsinhalt wiederzuerkennen ist. Titel sind nicht normativ.

[xlsx_catalog_anforderung_text]
section_type = xlsx
sheet = katalog
headline = Anforderung\nText & {Parameter}
function = text
cell_value_type = string
is_in_sheet = true
width = 40
hidden = false
level = 0
comment = Anforderungen (Controls): Anforderungen sind die zentralen Sicherheitsregeln und werden in OSCAL durch control-Elemente dargestellt. Sie beschreiben Zielzustände oder Grundprinzipien, die erreicht sein müssen, wenn die Anforderung als erfüllt gelten soll. Anforderungen werden durch ihren Titel und den dazugehörigen Anforderungstext beschrieben. Zu einer Anforderung können verschiedene Metadaten zugeordnet sein, z.B. Tags oder Verweise auf andere Anforderungen. Im Grundschutz++ folgt der Text der Anforderungen zudem einem bestimmten Format, der Satzschablone.\n\n{Parameter} zeigen Gestaltungsentscheidungen innerhalb einer Anforderung auf. Das ermöglicht es Katalogautoren und Anwendern auf einen Blick zu sehen wo steuernde Entscheidungen zu treffen sind. Bei einem Audit können die für den Parameter gesetzten Werte automatisiert geprüft werden. Parameter ermöglichen es außerdem Autoren, Anforderungen an spezifischere Kontexte anzupassen. Beispielsweise kann ein Parameter die maximale Anzahl von Fehlversuchen bei der Anmeldung definieren. Verwendet der Anwender hier einen Wert von 10, so kann er für alle Kataloge, die einen Wert von 10 erlauben, eine automatische Dokumentenprüfung bestehen. Diese strukturierte Darstellung unterstützt sowohl die menschliche Lesbarkeit als auch die maschinelle Verarbeitung von Sicherheitsanforderungen und fördert die Wiederverwendbarkeit und Vergleichbarkeit von Sicherheitsanforderungen und -prüfungen. In xlsx-Dokumenten sind Parameter an {geschweiften Klammern} innerhalb des Anforderungstextes zu erkennen.

[xlsx_catalog_implementierung]
section_type = xlsx
sheet = katalog
headline = Anforderung\nImplementierung?
function = link_implementierung
cell_value_type = url
is_in_sheet = true
width = 20
hidden = false
level = 2
comment = Noch kein Kommentar

[xlsx_catalog_praezisierung]
section_type = xlsx
sheet = katalog
headline = Anforderung\nPräzisierung
function = praezisierung
cell_value_type = string
is_in_sheet = true
width = 25
hidden = false
level = 2
comment = Präzisierung: Führt Zeit, Ort oder Inhalt der Anforderung näher aus.

[xlsx_catalog_verbesserung]
section_type = xlsx
sheet = katalog
headline = Anforderung\nVerbesserung
function = verbesserung
cell_value_type = string
is_in_sheet = true
width = 15
hidden = false
level = 2
comment = Verbesserung liegt vor, wenn die Anforderung eine generelle Anforderung erweitert und so die Schutzwirkung erhöht, z.B. die Ende-zu-Ende-Verschlüsselung als Verbesserung der Verschlüsselung beim Transport.\nEine Verbesserung fügt einer übergeordneten Anforderung Details oder mehr Tiefe hinzu.


[xlsx_catalog_tags]
section_type = xlsx
sheet = katalog
headline = Anforderung\nTags
function = tags
cell_value_type = string
is_in_sheet = true
width = 15
hidden = false
level = 2
comment = Tags sind definierte, in Fachkreisen bekannte Themen der Cyber- oder Informationssicherheit, deren Filterung bei der Umsetzung des Themas in einem ISMS unterstützen soll. Begriffe die bereits als Thema vorhanden sind, dürfen nicht auch als Tag verwendet werden. Ziel von Tags ist es nicht, das jeweilige Thema umfassend abzudecken, sondern vielmehr eine gezielte Suche nach den Anforderungen zu ermöglichen, die in besonderem Maße zu dem benannten Thema passen (“Top 10”).


[xlsx_catalog_handlung]
section_type = xlsx
sheet = katalog
headline = Anforderung\nHandlungswort
function = handlung
cell_value_type = string
is_in_sheet = true
width = 17
hidden = false
level = 2
comment = Handlungsworte sind definierte Tätigkeitsarten. Sie ermöglichen z.B. die Filterung nach Automatismen, Dokumentationsanforderungen oder regelmäßigen Überprüfungen.

[xlsx_catalog_zielobjekte]
section_type = xlsx
sheet = katalog
headline = Anforderung\nZielobjekte
function = zielobjekte
cell_value_type = string
is_in_sheet = true
width = 20
hidden = false
level = 2
comment = Zielobjekte sind von einer Menge an Anforderungen betroffene IT-Produkte, Verträge oder Adressatengruppen. Sie bilden eine Hierarchie von Zielobjekten und können anhand ihrer Definition klar bestimmt und voneinander abgegrenzt werden. Sind hier mehrere Zielobjekte angegeben, so handelt es sich um eine UND-Verknüpfung (“Hostsysteme von TK-Anwendungen”).

[xlsx_catalog_ergebnis]
section_type = xlsx
sheet = katalog
headline = Anforderung\nErgebnis
function = ergebnis
cell_value_type = string
is_in_sheet = true
width = 20
hidden = false
level = 2
comment = Ergebnis: Enthält das zu erreichende Schutzziel oder den Zielzustand, also den eigentlichen Inhalt der Anforderung.

[xlsx_catalog_dokumentation]
section_type = xlsx
sheet = katalog
headline = Anforderung\nDokumentation
function = dokumentation
cell_value_type = string
is_in_sheet = true
width = 20
hidden = false
level = 2
comment = Dokumentation: Dokumentationsempfehlungen sind definierte Arten von Dokumenten, die zum konsolidierten Nachweis der Erfüllung der Anforderungen genutzt werden können. Sie sind weder normativ noch bei der Auslegung zu beachten, d.h. nur als Vorschlag zur Umsetzung und nicht als inhaltliche Anforderung zu verstehen.

[xlsx_catalog_abhaengigkeit]
section_type = xlsx
sheet = 
headline = Anforderung\nAbhängigkeit
function = abhaengigkeit
cell_value_type = string
is_in_sheet = true
width = 14
hidden = false
level = 2
comment = Abhängigkeit einer Anforderung von einer anderen ist gegeben, wenn die abhängige Anforderung ihr Schutzziel nicht erreichen kann, ohne dass die vorausgesetzte Anforderung zuerst erfüllt ist. Hierbei sind ausschließlich zwingende Reihenfolgen berücksichtigt. In OSCAL wird dies über das links Array mit der Beziehung "required" abgebildet.

[xlsx_catalog_verwandte]
section_type = xlsx
sheet = katalog
headline = Anforderung\nAbhängigkeit
function = verwandte
cell_value_type = string
is_in_sheet = true
width = 14
hidden = false
level = 2
comment = Verwandte: Andere Anforderungen, die thematisch oder funktional mit der aktuellen Anforderung verbunden sind. Diese Verweise dienen dazu, die Zusammenhänge und Abhängigkeiten zwischen verschiedenen Anforderungen aufzuzeigen und zu verdeutlichen, wie sie gemeinsam zur Erreichung umfassender Sicherheitsmaßnahmen beitragen. In OSCAL werden sie über das links Array mit der Beziehung "related" abgebildet.

[xlsx_catalog_aufwand]
section_type = xlsx
sheet = katalog
headline = Anforderung\nAufwand
function = aufwand
cell_value_type = string
is_in_sheet = true
width = 14
hidden = false
level = 2
comment = Aufwand klassifiziert den ungefähren Ressourcenbedarf, der zur Realisierung einer Anforderung erforderlich ist. Da Aufwand und Schutzwirkung verschiedene Perspektiven sind, ist der Aufwand nicht mit dem Reifegrad oder dem Sicherheitsniveau zu verwechseln. Der Aufwand ist einschließlich der Voraussetzungen angegeben, daher darf eine Anforderung keine geringere Aufwandsklasse haben als die Anforderungen, von denen sie abhängig ist oder die sie verbessert.

[xlsx_catalog_authentizitaet]
section_type = xlsx
sheet = katalog
headline = Anforderung\nAuthentizität
function = sicherheitsziel_authentizitaet
cell_value_type = string
is_in_sheet = true
width = 14
hidden = false
level = 2
comment = Mit dem Begriff Authentizität (Authenticity) wird die Eigenschaft bezeichnet, die gewährleistet, dass eine Kommunikationsstelle tatsächlich diejenige ist, der sie vorgibt zu sein. Bei authentischen Informationen ist sichergestellt, dass sie von der angegebenen Quelle erstellt wurden. Der Begriff wird nicht nur verwendet, wenn die Identität von Personen geprüft wird, sondern auch bei IT-Komponenten oder Anwendungen. D.h. Die Echtheit einer Person, eines Systems oder von Daten muss nachweisbar sein.

[xlsx_catalog_integritaet]
section_type = xlsx
sheet = katalog
headline = Anforderung\nIntegrität
function = sicherheitsziel_integritaet
cell_value_type = string
is_in_sheet = true
width = 14
hidden = false
level = 2
comment = Integrität (Integrity) bezeichnet die Sicherstellung der Korrektheit (Unversehrtheit) von Daten und der korrekten Funktionsweise von Systemen. Wenn der Begriff Integrität auf "Daten" angewendet wird, drückt er aus, dass die Daten vollständig und unverändert sind. In der Informationstechnik wird er in der Regel aber weiter gefasst und auf "Informationen" angewendet. Der Begriff "Information" wird dabei für "Daten" verwendet, denen je nach Zusammenhang bestimmte Attribute wie z. B. Autorenschaft oder Zeitpunkt der Erstellung zugeordnet werden können. Der Verlust der Integrität von Informationen kann daher bedeuten, dass diese unerlaubt verändert, Angaben zur verfassenden Person verfälscht oder Zeitangaben zur Erstellung manipuliert wurden. D.h. Daten und Systeme müssen korrekt und unverändert sein. Unbefugte Änderungen dürfen nicht erfolgen.

