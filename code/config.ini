[xlsx_implementation_anforderung_text]
section_type = xlsx
sheet = implementierung
headline = Anforderung\nText & {Parameter}
function = text
cell_value_type = string
is_in_sheet = true
width = 40
hidden = false
level = 0
comment = Anforderungen (Controls): Anforderungen sind die zentralen Sicherheitsregeln und werden in OSCAL durch control-Elemente dargestellt. Sie beschreiben Zielzustände oder Grundprinzipien, die erreicht sein müssen, wenn die Anforderung als erfüllt gelten soll. Anforderungen werden durch ihren Titel und den dazugehörigen Anforderungstext beschrieben. Zu einer Anforderung können verschiedene Metadaten zugeordnet sein, z.B. Tags oder Verweise auf andere Anforderungen. Im Grundschutz++ folgt der Text der Anforderungen zudem einem bestimmten Format, der Satzschablone.\n\n{Parameter} zeigen Gestaltungsentscheidungen innerhalb einer Anforderung auf. Das ermöglicht es Katalogautoren und Anwendern auf einen Blick zu sehen wo steuernde Entscheidungen zu treffen sind. Bei einem Audit können die für den Parameter gesetzten Werte automatisiert geprüft werden. Parameter ermöglichen es außerdem Autoren, Anforderungen an spezifischere Kontexte anzupassen. Beispielsweise kann ein Parameter die maximale Anzahl von Fehlversuchen bei der Anmeldung definieren. Verwendet der Anwender hier einen Wert von 10, so kann er für alle Kataloge, die einen Wert von 10 erlauben, eine automatische Dokumentenprüfung bestehen. Diese strukturierte Darstellung unterstützt sowohl die menschliche Lesbarkeit als auch die maschinelle Verarbeitung von Sicherheitsanforderungen und fördert die Wiederverwendbarkeit und Vergleichbarkeit von Sicherheitsanforderungen und -prüfungen. In xlsx-Dokumenten sind Parameter an {geschweiften Klammern} innerhalb des Anforderungstextes zu erkennen.

[xlsx_implementation_description]
section_type = xlsx
sheet = implementierung
headline = Implementierung\nDarstellung
function = implementierung_description
cell_value_type = string
is_in_sheet = true
width = 50
hidden = false
level = 0
comment = Implementierung beinhaltet die Anteile description und remarks der Komponentendefinition zu einer Anforderung (sofern vorhanden).\n\nIn den Worten des BSI: Eine OSCAL-Komponentendefinition enthält eine Sammlung von Komponenten. Jede Komponente in einer Komponentendefinition beschreibt, wie eine bestimmte Implementierung einer Hardware, Software, eines Dienstes, einer Richtlinie, eines Prozesses oder einer Prozedur bestimmte Vorschriften aus einem oder mehreren OSCAL-Katalogen oder -Profilen unterstützen oder implementieren kann.\n\nDurch die Veröffentlichung eines Komponentensatzes in einer Komponentendefinition können Produkt- und Serviceanbieter, Richtlinien- und Prozessverantwortliche und andere Personen Informationen über die Implementierung von Anforderungen für ein von ihnen verwaltetes Zielobjekt austauschen. So können Lösungsbeschreibungen für das Thema in System-Sicherheitspläne (SSP) der Institution importiert werden. Diese Informationen können dann bei der technischen oder organisatorischen Implementierung verwendet werden. So muss sich nicht jede Institution die Lösungen "aus den Fingern saugen", die sie zur Umsetzung von Vorschriften einsetzen möchte, sondern kann auf Konzepte und Vorlagen aufbauen.\n\nEs ist wichtig zu beachten, dass Komponentendefinitionen keine tatsächlichen Implementierungen sind; vielmehr beschreiben Komponentendefinitionen eine Implementierung, die innerhalb eines Informationssystems eingesetzt werden kann. Beispielsweise könnte eine Komponente zur Transportverschlüsselung die Information "SSH über TLS 1.3 wird eingesetzt" enthalten. Somit dienen Komponentendefinitionen als Referenzen mit Inhalten, die (z. B. im SSP OSCAL-Modell) zur Entwicklung umfassender und konsistenter Implementierungen (wieder-)verwendet werden können. Sie ersetzen aber nicht das Handeln der für die Informationssicherheit verantwortlichen Stelle.\n\nQuelle: https://github.com/BSI-Bund/Stand-der-Technik-Bibliothek/tree/main/Implementierungsbeschreibungen/Komponenten

